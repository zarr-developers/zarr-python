# Shared Material for MkDocs configuration for the sub-package docs sites.
# Each package's mkdocs.yml pulls this in via INHERIT and defines only its
# identity (site_name, repo_*, site_description, site_url) and nav.
#
# INHERIT deep-merges mappings but *replaces* lists: a package that sets
# theme.features or markdown_extensions drops every entry below. So the lists
# here are the superset used by all packages (features, extensions, snippet
# base paths, and inventories a package never exercises are harmless); add to
# them here rather than in a package's mkdocs.yml.
site_author: Davis Bennett
use_directory_urls: true

watch:
  - src

theme:
  language: en
  name: material
  logo: _static/logo_bw.png
  favicon: _static/favicon-96x96.png

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.share

plugins:
  - autorefs
  - search
  - mkdocstrings:
      enable_inventory: true
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: true
            docstring_section_style: list
            docstring_style: numpy
            inherited_members: true
            line_length: 60
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            show_if_no_docstring: true
            extensions:
            - griffe_inherited_docstrings

          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://zarr.readthedocs.io/en/stable/objects.inv

# Override the header source widget's version fact (the monorepo's latest
# release) with the latest tag matching the package's prefix.
extra_javascript:
  - _static/source-version.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Content tabs; content.tabs.link in the theme features keeps tab sets
  # switched together.
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # The package root is last so docs/release-notes.md can include the
      # towncrier-managed CHANGELOG.md without moving it out of the package
      # root, where it is distributed and linked from the package metadata.
      # examples/ holds runnable example scripts (zarr-indexing); a missing
      # base path is skipped.
      base_path: [docs, examples, .]
      # Fail the build on an unresolvable include or missing region instead
      # of silently rendering nothing. zarr-indexing's
      # tests/test_doc_examples.py mirrors base_path.
      check_paths: true

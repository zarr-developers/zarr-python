[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "zarr-server"
dynamic = ["version"]
description = "HTTP server for Zarr stores, arrays, and groups."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Davis Bennett", email = "davis.v.bennett@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
keywords = ["zarr", "http", "server", "asgi"]
dependencies = [
    "zarr>=3.1",
    "starlette>=1.0",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/zarr-developers/zarr-python"
Source = "https://github.com/zarr-developers/zarr-python/tree/main/packages/zarr-server"
Issues = "https://github.com/zarr-developers/zarr-python/issues"
Changelog = "https://github.com/zarr-developers/zarr-python/blob/main/packages/zarr-server/CHANGELOG.md"
Documentation = "https://github.com/zarr-developers/zarr-python/blob/main/packages/zarr-server/README.md"

[dependency-groups]
test = ["pytest", "httpx", "httpx2"]

# Dev-only: resolve zarr from the repo root so package tests run against
# in-repo zarr. Affects uv resolution only, not published metadata.
[tool.uv.sources]
zarr = { path = "../..", editable = true }

[tool.hatch.version]
source = "vcs"
tag-pattern = '^zarr_server-v(?P<version>.+)$'
# `git_describe_command` ensures we get the zarr_server tags instead of latest.
# `local_scheme` strips the git commit info so the appending info is just a counter from latest tag.
# test-pypi doesn't accept git commit info in tags, and the count should be enough to distinguish unique runs.
raw-options = { root = "../..", git_describe_command = "git describe --dirty --tags --long --match zarr_server-v*", local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_server"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["tests"]
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
ignore_missing_imports = true
namespace_packages = false
pretty = true
show_error_code_links = true
show_error_context = true
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "truthy-iterable"]

[tool.towncrier]
# Fragments for this package live alongside the package source, separate
# from the parent zarr-python `changes/` directory, so a PR touching only
# `packages/zarr-server/` produces a release note for this package only.
directory = "changes"
filename = "CHANGELOG.md"
package = "zarr_server"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/zarr-developers/zarr-python/issues/{issue})"
start_string = "<!-- towncrier release notes start -->\n"

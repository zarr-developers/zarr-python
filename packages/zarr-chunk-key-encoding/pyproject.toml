[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "zarr-chunk-key-encoding"
dynamic = ["version"]
description = "Chunk key encodings for Zarr version 3 arrays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Davis Bennett", email = "davis.v.bennett@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["zarr"]
dependencies = [
    # First release that ships the v3 chunk key encoding metadata types
    # (zarr_metadata.v3.chunk_key_encoding).
    "zarr-metadata>=0.4.0",
    # TypeAliasType is imported from typing_extensions; the floor matches
    # zarr-metadata's.
    "typing_extensions>=4.16",
]

[project.urls]
Homepage = "https://github.com/zarr-developers/zarr-python"
Source = "https://github.com/zarr-developers/zarr-python/tree/main/packages/zarr-chunk-key-encoding"
Issues = "https://github.com/zarr-developers/zarr-python/issues"
Changelog = "https://github.com/zarr-developers/zarr-python/blob/main/packages/zarr-chunk-key-encoding/CHANGELOG.md"
Documentation = "https://zarr-chunk-key-encoding.readthedocs.io/"

[dependency-groups]
test = [
    "hypothesis==6.167.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
]
release = ["towncrier==25.8.0"]
docs = [
    # Pins match the zarr-python docs environment in the repo-root
    # pyproject.toml so the two sites render with the same toolchain.
    "mkdocs-material==9.7.7",
    "mkdocs==1.6.1",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.7",
    "griffe-inherited-docstrings==1.1.3",
    # mkdocstrings uses ruff to format rendered signatures
    "ruff==0.16.3",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^zarr_chunk_key_encoding-v(?P<version>.+)$'
# `git_describe_command` ensures we get the zarr_chunk_key_encoding tags instead of latest.
# `local_scheme` strips the git commit info so the appending info is just a counter from latest tag.
# test-pypi doesn't accept git commit info in tags, and the count should be enough to distinguish unique runs.
raw-options = { root = "../..", git_describe_command = "git describe --dirty --tags --long --match zarr_chunk_key_encoding-v*", local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_chunk_key_encoding"]

# An allowlist, so nothing that merely happens to sit in the package directory
# — a scratch script, a stray notebook, a local `.venv` — can ride along in a
# release. `/tests` and `/docs` ship so that a downstream packager can read and
# audit them, not so they can be run in place: every `justfile` recipe layers
# the sibling `../zarr-metadata` in as an editable overlay, and `test-parity`
# resolves the repo root, neither of which exists in an unpacked sdist. Running
# them needs the source tree. `changes/` and `.readthedocs.yaml` are
# deliberately absent: towncrier fragments are repo bookkeeping, and the RTD
# config addresses paths from the repo root. `pyproject.toml`, `README.md` and
# `LICENSE.txt` are added by hatchling itself.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/mkdocs.yml",
    "/justfile",
    "/CHANGELOG.md",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7"
# Collect the package source so every public Examples section executes under
# --doctest-modules and documented behavior cannot drift from the API.
testpaths = ["tests", "src/zarr_chunk_key_encoding"]
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers", "--doctest-modules"]
filterwarnings = [
    "error",
]

[tool.pyright]
include = ["src"]
enableExperimentalFeatures = true
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.numpydoc_validation]
checks = [
    "GL10",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]

[tool.towncrier]
# Fragments for this package live alongside the package source, separate
# from the parent zarr-python `changes/` directory, so a PR touching only
# `packages/zarr-chunk-key-encoding/` produces a release note for this
# package only.
directory = "changes"
filename = "CHANGELOG.md"
package = "zarr_chunk_key_encoding"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/zarr-developers/zarr-python/issues/{issue})"
start_string = "<!-- towncrier release notes start -->\n"

<svg aria-labelledby="projection-pair-title projection-pair-desc" class="zi-figure" role="img" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
  <title id="projection-pair-title">A cell domain projects into two coordinate spaces</title>
  <desc id="projection-pair-desc">one cell domain points to request and chunk-local spaces.</desc>
  <defs>
    <marker id="projection-pair-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="projection-pair-domain">
    <rect height="68" width="180" x="70" y="104" rx="10" ry="10" />
    <text x="160.0" y="138.0">cell domain</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="projection-pair-request-space">
    <rect height="60" width="188" x="462" y="42" />
    <rect class="zi-request-inner" height="52" width="180" x="466" y="46" />
    <text x="556.0" y="72.0">request space</text>
  </g>
  <g aria-label="chunk-local" class="zi-role-chunk-local" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" id="projection-pair-chunk-space">
    <rect height="60" width="188" x="462" y="174" />
    <text x="556.0" y="204.0">chunk-local space</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="projection-pair-request-projection">
    <line class="zi-arrow-line" marker-end="url(#projection-pair-arrowhead)" x1="250.0" x2="462.0" y1="123.0" y2="87.66666666666667" />
    <rect height="26" width="142" x="285.0" y="77.33333333333334" />
    <text x="356.0" y="90.33333333333334">request projection</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="projection-pair-chunk-projection">
    <line class="zi-arrow-line" marker-end="url(#projection-pair-arrowhead)" x1="250.0" x2="462.0" y1="153.0" y2="188.33333333333334" />
    <rect height="26" width="128" x="292.0" y="142.66666666666669" />
    <text x="356.0" y="155.66666666666669">chunk projection</text>
  </g>
  <g aria-label="Visible semantic role legend" class="zi-legend" id="projection-pair-legend">
    <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="projection-pair-legend-cell-domain">
      <rect class="zi-cue-swatch" height="20" width="28" x="22" y="298" rx="7" ry="7" />
      <text aria-label="cell-domain" class="zi-role-label" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" x="58" y="308">cell-domain</text>
    </g>
    <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="projection-pair-legend-request">
      <rect class="zi-cue-swatch" height="20" width="28" x="192" y="298" />
      <rect class="zi-request-inner" height="14" width="22" x="195" y="301" />
      <text aria-label="request" class="zi-role-label" data-non-color-cue="request label + double border" data-semantic-role="request" x="228" y="308">request</text>
    </g>
    <g aria-label="chunk-local" class="zi-role-chunk-local" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" id="projection-pair-legend-chunk-local">
      <rect class="zi-cue-swatch" height="20" width="28" x="362" y="298" />
      <text aria-label="chunk-local" class="zi-role-label" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" x="398" y="308">chunk-local</text>
    </g>
    <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="projection-pair-legend-text">
      <rect class="zi-cue-swatch" height="20" width="28" x="532" y="298" />
      <text aria-label="text" class="zi-role-label" data-non-color-cue="text label" data-semantic-role="text" x="568" y="308">text</text>
    </g>
  </g>
</svg>

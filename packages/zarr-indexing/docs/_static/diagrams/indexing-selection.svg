<svg aria-labelledby="indexing-selection-title indexing-selection-desc" class="zi-figure" role="img" viewBox="0 0 720 390" xmlns="http://www.w3.org/2000/svg">
  <title id="indexing-selection-title">Basic indexing selects a one-dimensional request</title>
  <desc id="indexing-selection-desc">image[1:5, 2] maps four source cells to a length-four request.</desc>
  <defs>
    <marker id="indexing-selection-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="indexing-selection-source-grid">
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="34" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="34" />
    <rect class="zi-grid-cell" height="42" width="42" x="474" y="34" />
    <rect class="zi-grid-cell" height="42" width="42" x="516" y="34" />
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="76" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="76" />

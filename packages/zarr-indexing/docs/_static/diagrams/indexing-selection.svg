<svg aria-labelledby="indexing-selection-title indexing-selection-desc" class="zi-figure" role="img" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <title id="indexing-selection-title">A slice maps result coordinates to selected source values</title>
  <desc id="indexing-selection-desc">source[2:5] maps source coordinates 2, 3, 4, containing values 12, 13, 14, to result coordinates 0, 1, 2, respectively.</desc>
  <defs>
    <marker id="indexing-selection-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-selection-expression">
    <text x="180" y="22">source[2:5]</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-title">
    <text x="180" y="48">source values</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="indexing-selection-source-values">
    <rect class="zi-grid-cell" height="48" width="48" x="36" y="86" />
    <text class="zi-cell-value" x="60.0" y="110.0">10</text>
    <rect class="zi-grid-cell" height="48" width="48" x="84" y="86" />
    <text class="zi-cell-value" x="108.0" y="110.0">11</text>
    <g aria-label="selected coordinate (0, 2), value 12" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="indexing-selection-source-values-selected-0-2">
      <rect class="zi-grid-cell zi-role-selected" height="48" width="48" x="132" y="86" />
      <text class="zi-cell-value" x="156.0" y="110.0">12</text>
    </g>
    <g aria-label="selected coordinate (0, 3), value 13" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="indexing-selection-source-values-selected-0-3">
      <rect class="zi-grid-cell zi-role-selected" height="48" width="48" x="180" y="86" />
      <text class="zi-cell-value" x="204.0" y="110.0">13</text>
    </g>
    <g aria-label="selected coordinate (0, 4), value 14" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="indexing-selection-source-values-selected-0-4">
      <rect class="zi-grid-cell zi-role-selected" height="48" width="48" x="228" y="86" />
      <text class="zi-cell-value" x="252.0" y="110.0">14</text>
    </g>
    <rect class="zi-grid-cell" height="48" width="48" x="276" y="86" />
    <text class="zi-cell-value" x="300.0" y="110.0">15</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-0">
    <text x="60" y="72">0</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-1">
    <text x="108" y="72">1</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-2">
    <text x="156" y="72">2</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-3">
    <text x="204" y="72">3</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-4">
    <text x="252" y="72">4</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-index-5">
    <text x="300" y="72">5</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-coordinate-label">
    <text x="78" y="178">result coordinate</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-coordinate-label">
    <text x="78" y="214">source coordinate</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-value-label">
    <text x="78" y="256">result value</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-coordinate-0">
    <text x="188" y="178">0</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-coordinate-1">
    <text x="236" y="178">1</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-coordinate-2">
    <text x="284" y="178">2</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-coordinate-0">
    <text x="188" y="214">2</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-coordinate-1">
    <text x="236" y="214">3</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-source-coordinate-2">
    <text x="284" y="214">4</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-value-0">
    <rect height="44" width="48" x="164" y="234" />
    <text x="188.0" y="256.0">12</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-value-1">
    <rect height="44" width="48" x="212" y="234" />
    <text x="236.0" y="256.0">13</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-result-value-2">
    <rect height="44" width="48" x="260" y="234" />
    <text x="284.0" y="256.0">14</text>
  </g>
</svg>

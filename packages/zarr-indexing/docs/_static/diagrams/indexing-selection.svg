    <rect class="zi-grid-cell" height="42" width="42" x="516" y="76" />
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="118" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="118" />
    <rect class="zi-grid-cell zi-role-selected" height="42" width="42" x="474" y="118" />
    <rect class="zi-grid-cell" height="42" width="42" x="516" y="118" />
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="160" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="160" />
    <rect class="zi-grid-cell zi-role-selected" height="42" width="42" x="474" y="160" />
    <rect class="zi-grid-cell" height="42" width="42" x="516" y="160" />
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="202" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="202" />
    <rect class="zi-grid-cell zi-role-selected" height="42" width="42" x="474" y="202" />
    <rect class="zi-grid-cell" height="42" width="42" x="516" y="202" />
    <rect class="zi-grid-cell" height="42" width="42" x="390" y="244" />
    <rect class="zi-grid-cell" height="42" width="42" x="432" y="244" />
    <rect class="zi-grid-cell" height="42" width="42" x="474" y="244" />
    <rect class="zi-grid-cell" height="42" width="42" x="516" y="244" />
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="indexing-selection-request-vector">
    <rect height="58" width="180" x="42" y="114" />
    <rect class="zi-request-inner" height="50" width="172" x="46" y="118" />
    <text x="132.0" y="143.0">request: length 4</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-selection-map">
    <line class="zi-arrow-line" marker-end="url(#indexing-selection-arrowhead)" x1="222.0" x2="576.0" y1="144.83673469387756" y2="152.0612244897959" />
    <rect height="26" width="114" x="342.0" y="120.44897959183675" />
    <text x="399.0" y="133.44897959183675">i ↦ (i + 1, 2)</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="indexing-selection-source-grid-label">
    <rect height="46" width="92" x="576" y="130" />
    <text x="622.0" y="153.0">4 cells</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-expression">
    <rect height="26" width="107" x="56.5" y="69" />
    <text x="110" y="82">image[1:5, 2]</text>
  </g>
  <g aria-label="Visible semantic role legend" class="zi-legend" id="indexing-selection-legend">
    <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="indexing-selection-legend-source">
      <rect class="zi-cue-swatch" height="20" width="28" x="22" y="358" />
      <text aria-label="source" class="zi-role-label" data-non-color-cue="source label + neutral single border" data-semantic-role="source" x="58" y="368">source</text>
    </g>
    <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="indexing-selection-legend-request">
      <rect class="zi-cue-swatch" height="20" width="28" x="192" y="358" />
      <rect class="zi-request-inner" height="14" width="22" x="195" y="361" />
      <text aria-label="request" class="zi-role-label" data-non-color-cue="request label + double border" data-semantic-role="request" x="228" y="368">request</text>
    </g>
    <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="indexing-selection-legend-text">
      <rect class="zi-cue-swatch" height="20" width="28" x="362" y="358" />
      <text aria-label="text" class="zi-role-label" data-non-color-cue="text label" data-semantic-role="text" x="398" y="368">text</text>
    </g>
    <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="indexing-selection-legend-selected">
      <rect class="zi-cue-swatch" height="20" width="28" x="532" y="358" />
      <text aria-label="selected" class="zi-role-label" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" x="568" y="368">selected</text>
    </g>
  </g>
</svg>

<svg aria-labelledby="system-memory-chunk-lifecycle-title system-memory-chunk-lifecycle-desc" class="zi-figure" role="img" viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg">
  <title id="system-memory-chunk-lifecycle-title">A decoded chunk moves through a system-memory lifecycle</title>
  <desc id="system-memory-chunk-lifecycle-desc">chunks move through queued and loading states before system-memory residency, with explicit failure, retry, eviction, and reload paths.</desc>
  <defs>
    <marker id="system-memory-chunk-lifecycle-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="system-memory-chunk-lifecycle-new">
    <rect height="58" width="96" x="24" y="54" />
    <text x="72.0" y="83.0">NEW</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="system-memory-chunk-lifecycle-queued">
    <rect height="58" width="96" x="186" y="54" />
    <rect class="zi-request-inner" height="50" width="88" x="190" y="58" />
    <text x="234.0" y="83.0">QUEUED</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="system-memory-chunk-lifecycle-loading">
    <rect height="58" width="96" x="338" y="54" />
    <text x="386.0" y="83.0">LOADING</text>
  </g>
  <g aria-label="chunk-local" class="zi-role-chunk-local" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" id="system-memory-chunk-lifecycle-ready">
    <rect height="58" width="172" x="564" y="54" />
    <text x="650.0" y="83.0">READY: system memory</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="system-memory-chunk-lifecycle-failed">
    <rect height="58" width="96" x="338" y="276" />
    <text x="386.0" y="305.0">FAILED</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="system-memory-chunk-lifecycle-evicted">
    <rect height="58" width="112" x="594" y="360" />
    <text x="650.0" y="389.0">EVICTED</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-request-new">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="120.0" x2="186.0" y1="83.0" y2="83.0" />
    <rect height="26" width="65" x="120.5" y="55.0" />
    <text x="153.0" y="68.0">request</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-drain-queue">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="282.0" x2="338.0" y1="83.0" y2="83.0" />
    <rect height="26" width="51" x="284.5" y="55.0" />
    <text x="310.0" y="68.0">drain</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-read-succeeds">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="434.0" x2="564.0" y1="83.0" y2="83.0" />
    <rect height="26" width="107" x="445.5" y="55.0" />
    <text x="499.0" y="68.0">read succeeds</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-read-fails">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="386.0" x2="386.0" y1="112.0" y2="276.0" />
    <rect height="26" width="86" x="405.0" y="166.0" />
    <text x="448.0" y="179.0">read fails</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-retry-failed">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="366.14414414414415" x2="253.85585585585585" y1="276.0" y2="112.0" />
    <rect height="26" width="114" x="211.0" y="200.0" />
    <text x="268.0" y="213.0">explicit retry</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-evict-ready">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="650.0" x2="650.0" y1="112.0" y2="360.0" />
    <rect height="26" width="100" x="636.0" y="208.0" />
    <text x="686.0" y="221.0">LRU pressure</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-reload-evicted">
    <line class="zi-arrow-line" marker-end="url(#system-memory-chunk-lifecycle-arrowhead)" x1="610.5751633986928" x2="273.4248366013072" y1="360.0" y2="112.0" />
    <rect height="26" width="107" x="502.5" y="214.0" />
    <text x="556.0" y="227.0">request again</text>
  </g>
  <g aria-label="Visible semantic role legend" class="zi-legend" id="system-memory-chunk-lifecycle-legend">
    <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="system-memory-chunk-lifecycle-legend-source">
      <rect class="zi-cue-swatch" height="20" width="28" x="22" y="426" />
      <text aria-label="source" class="zi-role-label" data-non-color-cue="source label + neutral single border" data-semantic-role="source" x="58" y="436">source</text>
    </g>
    <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="system-memory-chunk-lifecycle-legend-request">
      <rect class="zi-cue-swatch" height="20" width="28" x="192" y="426" />
      <rect class="zi-request-inner" height="14" width="22" x="195" y="429" />
      <text aria-label="request" class="zi-role-label" data-non-color-cue="request label + double border" data-semantic-role="request" x="228" y="436">request</text>
    </g>
    <g aria-label="chunk-local" class="zi-role-chunk-local" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" id="system-memory-chunk-lifecycle-legend-chunk-local">
      <rect class="zi-cue-swatch" height="20" width="28" x="362" y="426" />
      <text aria-label="chunk-local" class="zi-role-label" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" x="398" y="436">chunk-local</text>
    </g>
    <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="system-memory-chunk-lifecycle-legend-text">
      <rect class="zi-cue-swatch" height="20" width="28" x="532" y="426" />
      <text aria-label="text" class="zi-role-label" data-non-color-cue="text label" data-semantic-role="text" x="568" y="436">text</text>
    </g>
  </g>
</svg>

<svg aria-labelledby="result-array-shape-title result-array-shape-desc" class="zi-figure" role="img" viewBox="0 0 390 465" xmlns="http://www.w3.org/2000/svg">
  <title id="result-array-shape-title">Indexes define result axes as well as source points</title>
  <desc id="result-array-shape-desc">image[1, :] and image[1:2, :] select the same source coordinates and values 4, 5, 6, 7, but define result shapes (4,) and (1, 4), respectively.</desc>
  <defs>
    <marker id="result-array-shape-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="result-array-shape-shared-coordinates">
    <text x="195" y="30">same source coordinates: (1, 0), (1, 1), (1, 2), (1, 3)</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="result-array-shape-shared-values-label">
    <text x="92" y="58">shared values:</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-shared-value-4">
    <text x="158" y="58">4</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-shared-value-5">
    <text x="206" y="58">5</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-shared-value-6">
    <text x="254" y="58">6</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-shared-value-7">
    <text x="302" y="58">7</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="result-array-shape-integer-index">
    <rect height="26" width="93" x="18.5" y="97" />
    <text x="65" y="110">image[1, :]</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-integer-row">
    <rect class="zi-sequence-cell" height="48" width="50.0" x="138.0" y="86" />
    <text class="zi-cell-coordinate" x="163.0" y="101.0">coord: 0</text>
    <text class="zi-cell-value" x="163.0" y="120.0">value: 4</text>
    <rect class="zi-sequence-cell" height="48" width="50.0" x="188.0" y="86" />
    <text class="zi-cell-coordinate" x="213.0" y="101.0">coord: 1</text>
    <text class="zi-cell-value" x="213.0" y="120.0">value: 5</text>
    <rect class="zi-sequence-cell" height="48" width="50.0" x="238.0" y="86" />
    <text class="zi-cell-coordinate" x="263.0" y="101.0">coord: 2</text>
    <text class="zi-cell-value" x="263.0" y="120.0">value: 6</text>
    <rect class="zi-sequence-cell" height="48" width="50.0" x="288.0" y="86" />
    <text class="zi-cell-coordinate" x="313.0" y="101.0">coord: 3</text>
    <text class="zi-cell-value" x="313.0" y="120.0">value: 7</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="result-array-shape-integer-shape">
    <rect height="26" width="86" x="152.0" y="143" />
    <text x="195" y="156">shape (4,)</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="result-array-shape-integer-explanation">
    <text x="195" y="184">integer fixes axis 0 → axis omitted</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="result-array-shape-slice-index">
    <rect height="26" width="107" x="16.5" y="225" />
    <text x="70" y="238">image[1:2, :]</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="result-array-shape-slice-axis-frame">
    <rect height="140" width="230" x="80" y="260" />
    <text x="195.0" y="330.0">axis 0 coordinate 0</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-slice-row">
    <g aria-label="selected coordinate (0, 0), value 4" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-slice-row-selected-0-0">
      <rect class="zi-grid-cell zi-role-selected" height="50" width="50" x="95" y="342" />
      <text class="zi-cell-value" x="120.0" y="367.0">4</text>
    </g>
    <g aria-label="selected coordinate (0, 1), value 5" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-slice-row-selected-0-1">
      <rect class="zi-grid-cell zi-role-selected" height="50" width="50" x="145" y="342" />
      <text class="zi-cell-value" x="170.0" y="367.0">5</text>
    </g>
    <g aria-label="selected coordinate (0, 2), value 6" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-slice-row-selected-0-2">
      <rect class="zi-grid-cell zi-role-selected" height="50" width="50" x="195" y="342" />
      <text class="zi-cell-value" x="220.0" y="367.0">6</text>
    </g>
    <g aria-label="selected coordinate (0, 3), value 7" class="zi-role-selected zi-selected-cell" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="result-array-shape-slice-row-selected-0-3">
      <rect class="zi-grid-cell zi-role-selected" height="50" width="50" x="245" y="342" />
      <text class="zi-cell-value" x="270.0" y="367.0">7</text>
    </g>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="result-array-shape-slice-shape">
    <rect height="26" width="100" x="145.0" y="409" />
    <text x="195" y="422">shape (1, 4)</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="result-array-shape-slice-explanation">
    <text x="195" y="452">slice keeps axis 0 → length-one axis retained</text>
  </g>
</svg>

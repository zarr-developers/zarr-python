<svg aria-labelledby="coordinate-addresses-title coordinate-addresses-desc" class="zi-figure" role="img" viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg">
  <title id="coordinate-addresses-title">Negative and non-negative coordinates are peer addresses</title>
  <desc id="coordinate-addresses-desc">domain [-2, 3) gives equal status to -2, -1, 0, 1, 2.</desc>
  <defs>
    <marker id="coordinate-addresses-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-coordinate--2">
    <rect height="62" width="72" x="80" y="62" rx="10" ry="10" />
    <text x="116.0" y="93.0">-2</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-coordinate--1">
    <rect height="62" width="72" x="192" y="62" rx="10" ry="10" />
    <text x="228.0" y="93.0">-1</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-coordinate-0">
    <rect height="62" width="72" x="304" y="62" rx="10" ry="10" />
    <text x="340.0" y="93.0">0</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-coordinate-1">
    <rect height="62" width="72" x="416" y="62" rx="10" ry="10" />
    <text x="452.0" y="93.0">1</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-coordinate-2">
    <rect height="62" width="72" x="528" y="62" rx="10" ry="10" />
    <text x="564.0" y="93.0">2</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="coordinate-addresses-domain-label">
    <rect height="26" width="149" x="45.5" y="29" />
    <text x="120" y="42">cell domain [-2, 3)</text>
  </g>
  <g aria-label="Visible semantic role legend" class="zi-legend" id="coordinate-addresses-legend">
    <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="coordinate-addresses-legend-cell-domain">
      <rect class="zi-cue-swatch" height="20" width="28" x="22" y="218" rx="7" ry="7" />
      <text aria-label="cell-domain" class="zi-role-label" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" x="58" y="228">cell-domain</text>
    </g>
    <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="coordinate-addresses-legend-text">
      <rect class="zi-cue-swatch" height="20" width="28" x="192" y="218" />
      <text aria-label="text" class="zi-role-label" data-non-color-cue="text label" data-semantic-role="text" x="228" y="228">text</text>
    </g>
  </g>
</svg>

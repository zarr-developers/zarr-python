<svg aria-labelledby="compose-views-title compose-views-desc" class="zi-figure" role="img" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <title id="compose-views-title">Composed views reduce to one direct request-to-source map</title>
  <desc id="compose-views-desc">two view maps collapse into one direct map.</desc>
  <defs>
    <marker id="compose-views-arrowhead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="6" refY="3.5" viewBox="0 0 7 7">
      <path class="zi-arrowhead" d="M 0 0 L 7 3.5 L 0 7 z" />
    </marker>
  </defs>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="compose-views-request-chain">
    <rect height="52" width="128" x="34" y="42" />
    <rect class="zi-request-inner" height="44" width="120" x="38" y="46" />
    <text x="98.0" y="68.0">request</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="compose-views-outer-view">
    <rect height="52" width="128" x="222" y="42" rx="10" ry="10" />
    <text x="286.0" y="68.0">outer view</text>
  </g>
  <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="compose-views-inner-view">
    <rect height="52" width="128" x="410" y="42" rx="10" ry="10" />
    <text x="474.0" y="68.0">inner view</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="compose-views-source-chain">
    <rect height="52" width="128" x="598" y="42" />
    <text x="662.0" y="68.0">source</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="compose-views-map-one">
    <line class="zi-arrow-line" marker-end="url(#compose-views-arrowhead)" x1="162.0" x2="222.0" y1="68.0" y2="68.0" />
    <rect height="26" width="51" x="166.5" y="40.0" />
    <text x="192.0" y="53.0">map 2</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="compose-views-map-two">
    <line class="zi-arrow-line" marker-end="url(#compose-views-arrowhead)" x1="350.0" x2="410.0" y1="68.0" y2="68.0" />
    <rect height="26" width="65" x="347.5" y="40.0" />
    <text x="380.0" y="53.0">compose</text>
  </g>
  <g aria-label="text" class="zi-role-text" data-non-color-cue="text label" data-semantic-role="text" id="compose-views-map-three">
    <line class="zi-arrow-line" marker-end="url(#compose-views-arrowhead)" x1="538.0" x2="598.0" y1="68.0" y2="68.0" />
    <rect height="26" width="51" x="542.5" y="40.0" />
    <text x="568.0" y="53.0">map 1</text>
  </g>
  <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="compose-views-request-direct">
    <rect height="56" width="150" x="128" y="164" />
    <rect class="zi-request-inner" height="48" width="142" x="132" y="168" />
    <text x="203.0" y="192.0">request</text>
  </g>
  <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="compose-views-source-direct">
    <rect height="56" width="150" x="482" y="164" />
    <text x="557.0" y="192.0">source</text>
  </g>
  <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="compose-views-direct-map">
    <line class="zi-arrow-line" marker-end="url(#compose-views-arrowhead)" x1="278.0" x2="482.0" y1="192.0" y2="192.0" />
    <rect height="26" width="114" x="323.0" y="164.0" />
    <text x="380.0" y="177.0">one direct map</text>
  </g>
  <g aria-label="Visible semantic role legend" class="zi-legend" id="compose-views-legend">
    <g aria-label="request" class="zi-role-request" data-non-color-cue="request label + double border" data-semantic-role="request" id="compose-views-legend-request">
      <rect class="zi-cue-swatch" height="20" width="28" x="22" y="308" />
      <rect class="zi-request-inner" height="14" width="22" x="25" y="311" />
      <text aria-label="request" class="zi-role-label" data-non-color-cue="request label + double border" data-semantic-role="request" x="58" y="318">request</text>
    </g>
    <g aria-label="cell-domain" class="zi-role-cell-domain" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" id="compose-views-legend-cell-domain">
      <rect class="zi-cue-swatch" height="20" width="28" x="192" y="308" rx="7" ry="7" />
      <text aria-label="cell-domain" class="zi-role-label" data-non-color-cue="cell-domain label + rounded border" data-semantic-role="cell-domain" x="228" y="318">cell-domain</text>
    </g>
    <g aria-label="source" class="zi-role-source" data-non-color-cue="source label + neutral single border" data-semantic-role="source" id="compose-views-legend-source">
      <rect class="zi-cue-swatch" height="20" width="28" x="362" y="308" />
      <text aria-label="source" class="zi-role-label" data-non-color-cue="source label + neutral single border" data-semantic-role="source" x="398" y="318">source</text>
    </g>
    <g aria-label="selected" class="zi-role-selected" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" id="compose-views-legend-selected">
      <rect class="zi-cue-swatch" height="20" width="28" x="532" y="308" />
      <text aria-label="selected" class="zi-role-label" data-non-color-cue="coordinate label + heavy outline" data-semantic-role="selected" x="568" y="318">selected</text>
    </g>
  </g>
</svg>

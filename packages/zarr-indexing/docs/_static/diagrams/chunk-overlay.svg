    <text x="220" y="465">global chunk_domain [0, 2) × [2, 4)</text>
  </g>
  <g aria-label="chunk-local" class="zi-role-chunk-local" data-non-color-cue="chunk-local label + dashed border" data-semantic-role="chunk-local" id="chunk-overlay-chunk-one-local">

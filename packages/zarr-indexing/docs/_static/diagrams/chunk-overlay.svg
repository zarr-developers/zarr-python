<svg aria-labelledby="chunk-overlay-title chunk-overlay-desc" class="zi-figure" role="img" viewBox="0 0 440 610" xmlns="http://www.w3.org/2000/svg">
  <title id="chunk-overlay-title">The selection crosses one chunk-row boundary</title>

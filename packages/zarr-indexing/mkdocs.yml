INHERIT: ../mkdocs-base.yml

site_name: zarr-indexing
# The package lives in the zarr-python monorepo; point the header source
# widget at the package directory rather than the repository root.
repo_name: zarr-python/packages/zarr-indexing
repo_url: https://github.com/zarr-developers/zarr-python/tree/main/packages/zarr-indexing
# Absolute because mkdocs would otherwise append this to repo_url's subpath.
edit_uri: https://github.com/zarr-developers/zarr-python/edit/main/packages/zarr-indexing/docs/
site_description: Composable, lazy coordinate transforms for Zarr array indexing.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://zarr-indexing.readthedocs.io/']
exclude_docs: |
  snippets/*.py

# --strict promotes warnings to errors, but broken link anchors and pages
# missing from nav are only INFO by default — a strict build passed with
# both breakages. Warn so strict actually fails on them.
validation:
  links:
    anchors: warn
  nav:
    omitted_files: warn

# Top-level rank is consistent: collections (Guide, Examples, API Reference)
# and standalone artifacts (landing, ndsel spec, design notes, release notes).
# Guide mirrors the docs/guide/ directory — its three pages are one
# collection (learn / look up / integrate), pydantic's Concepts pattern at
# small scale; navigation.indexes makes the Guide entry itself land on the
# visual guide. No tabs: at eight content pages, hiding sections costs more
# than it organizes.
nav:
  - index.md
  - Guide:
      - guide/index.md
      - Indexing patterns: guide/patterns.md
      - From a selection to chunk operations: guide/selection-flow.md
      - Integration boundaries: guide/integrations.md
  - Examples:
      - Lazy indexing a NumPy array: examples/lazy_indexing_numpy.md
      - Lazy indexing with Dask: examples/lazy_indexing_dask.md
      - System-memory chunk cache: examples/system_memory_chunk_cache.md
  - The ndsel wire format: ndsel.md
  - Design notes: design-notes.md
  - API Reference:
      - api/index.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.transform</code>': api/transform.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.domain</code>': api/domain.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.output_map</code>': api/output_map.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.chunk_resolution</code>': api/chunk_resolution.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.grid</code>': api/grid.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.lazy_array</code>': api/lazy_array.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.reader</code>': api/reader.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.writer</code>': api/writer.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.eager</code>': api/eager.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.boundary</code>': api/boundary.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.json</code>': api/json.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.messages</code>': api/messages.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.errors</code>': api/errors.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.testing.stateful</code>': api/testing_stateful.md
      - '<code class="doc-symbol doc-symbol-toc doc-symbol-module"></code> <code>zarr_indexing.testing.strategies</code>': api/testing_strategies.md
  - Release notes: release-notes.md
  # This site is a Read the Docs subproject of zarr-python; give readers a way
  # back to the parent docs, which list every companion package.
  - 'zarr-python ↪': https://zarr.readthedocs.io/

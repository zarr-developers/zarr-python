name: zarr-indexing

on:
  push:
    branches: [main]
    paths:
      - 'packages/zarr-indexing/**'
      - '.github/workflows/zarr-indexing.yml'
  pull_request:
    paths:
      - 'packages/zarr-indexing/**'
      - '.github/workflows/zarr-indexing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest py=${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # The transform tests exercise chunk resolution against zarr's ChunkGrid,
      # so they run from the repo root against the root environment (which
      # provides `zarr`) with this package as an editable overlay rather than in
      # package isolation.
      - name: Sync test dependency group
        run: uv sync --group test --python ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run --no-sync --group test --with-editable ./packages/zarr-indexing python -m pytest packages/zarr-indexing/tests packages/zarr-indexing/src/zarr_indexing
      # TensorStore is the oracle for the parity tests
      # (test_ndsel_tensorstore.py skips without it). It ships binary wheels
      # only, so it rides in as a run-time overlay here rather than joining a
      # dependency group; if a future matrix Python lacks a tensorstore wheel,
      # gate this step on the matrix version.
      - name: Run pytest (tensorstore parity)
        run: uv run --no-sync --group test --with-editable ./packages/zarr-indexing --with 'tensorstore>=0.1.84' python -m pytest packages/zarr-indexing/tests/test_ndsel_tensorstore.py packages/zarr-indexing/tests/test_tensorstore_parity.py

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-indexing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run ruff
        # Pinned to the repo-wide ruff version (see pyproject.toml [dependency-groups] docs); bump together.
        run: uvx ruff@0.15.22 check .

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-indexing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync test dependency group
        run: uv sync --group test --python 3.12
      - name: Run pyright
        run: uv run --group test --with pyright pyright

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-indexing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build docs
        # The strict mkdocs build lives in packages/zarr-indexing/justfile.
        run: just docs-check

  zarr-indexing-complete:
    name: zarr-indexing complete
    needs: [test, ruff, pyright, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check failure
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo Success!
